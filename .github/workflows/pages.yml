name: Build, test, deploy

# Pull requests: lint, typecheck, unit tests, static build, browser tests.
# Pushes to main: the same, then deploy out/ to GitHub Pages and re-run the
# browser tests against the live URL. GitHub Pages has no per-PR preview
# environment; the PR build is uploaded as a downloadable artifact instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The Pages URL (origin + /<repo> path) comes from the repository's Pages
      # settings, so canonical and Open Graph URLs never name an assumed host.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser tests against the build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PORT: "4173"
          # Metadata in this build names the production URL; checks compare
          # against it while pages are fetched from the local server.
          SITE_URL: http://localhost:4173${{ steps.pages.outputs.base_path }}
          CANONICAL_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/serve-out.mjs &
          for i in $(seq 1 30); do curl -sf "$SITE_URL/ko/" > /dev/null && break; sleep 1; done
          python tests/e2e/run_e2e.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: tests/e2e/screenshots/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser tests against the live site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/e2e/run_e2e.py
